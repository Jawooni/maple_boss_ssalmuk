# 매일 아이템매니아 일 평균시세를 받아 rates.js를 갱신·커밋한다 (Pages는 main 푸시로 재배포됨)
name: 메소 시세 갱신

on:
  schedule:
    - cron: '0 2 * * *'  # 매일 11:00 KST (아이템매니아는 10시 무렵 전날까지 집계)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_rates.py, .github/workflows/rates.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python fetch_rates.py
      - name: rates.js 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.js
          git diff --cached --quiet && echo '변경 없음' && exit 0
          git commit -m "rates.js 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
