# 아이템매니아 일 평균시세를 받아 rates.js를 갱신·커밋한다 (Pages는 main 푸시로 재배포됨)
# GitHub 러너(해외 IP)에서는 아이템매니아 연결이 시간 초과되어 수동 실행만 남김.
# 매일 수집은 Oracle Cloud VM의 update_rates.sh가 담당 (SETUP_ORACLE.md 참고).
name: 메소 시세 갱신

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python fetch_rates.py
      - name: rates.js 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.js
          git diff --cached --quiet && echo '변경 없음' && exit 0
          git commit -m "rates.js 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
